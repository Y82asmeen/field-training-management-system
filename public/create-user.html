<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="create_user_title">إنشاء مستخدم جديد</title>
    <link rel="stylesheet" href="css/welcome.css">
    <link rel="stylesheet" href="css/edit-user.css"> <!-- نستخدم نفس الـ CSS للتوحيد -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="edit-page-body">
    <div id="navbar"></div>
    <div class="edit-container">
        <div class="edit-card">
            <div class="edit-header">
                <div class="header-icon"><i class="fa-solid fa-user-plus"></i></div>
                <h2 data-i18n="create_user">إضافة مستخدم جديد للنظام</h2>
                <p data-i18n="create_user_subtitle">قم بتعبئة البيانات لإنشاء حساب جديد</p>
            </div>
            <div class="edit-form">
                <div class="form-group">
                    <label data-i18n="name">الاسم الكامل</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="name" placeholder="أدخل اسم المستخدم">
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="email"> البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="example@test.com">
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="********">
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="role">نوع الحساب (الدور)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-halved"></i>
                        <select id="user_type">
                            <option value="student">طالب</option>
                            <option value="supervisor">مشرف أكاديمي</option>
                            <option value="training_companies">ممثل جهة تدريب (شركة)</option>
                            <option value="admin">مدير نظام</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn-save" onclick="createUser()">
                        <i class="fa-solid fa-plus"></i>
                        <span data-i18n="add_user_btn">إنشاء الحساب</span>
                    </button>
                    <button class="btn-cancel" onclick="window.history.back()">
                        <span data-i18n="cancel">إلغاء</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/navbar.js"></script>
    <script src="js/translation.js"></script>
    <script src="js/main.js"></script>
    <script src="js/create-user.js"></script>
</body>
</html>
