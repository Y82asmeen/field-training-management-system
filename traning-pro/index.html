<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>ادارة التدريب الميداني</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
    <div class="nav-container">
        <div class="nav-logo">نظام التدريب</div>

        <ul class="nav-links">
            <li><a href="#">الرئيسية</a></li>
            <li><a href="#">عن النظام</a></li>
            <li><a href="#">آلية التدريب</a></li>
            <li><a href="#">تواصل معنا</a></li>
        </ul>
    </div>
</nav>

    <section class="hero">
        <div class="overlay"></div>

        <div class="content">
            <div class="logo-wrapper">
                <img src="logoo1.png" alt="Logo" class="logo">
            </div>
            <h1 class="site-name">ادارة التدريب الميداني</h1>
            <p id="typing-text">
            </p>

            <div class="btn-group">
                <button class="start-btn login-btn">تسجيل دخول</button>
                <button class="start-btn register-btn">إنشاء حساب</button>
            </div>

        </div>
    </section>
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const text = "إدارة التدريب الميداني بفعالية وسهولة ل الطلاب والمشرفين الأكاديميين";
            const element = document.getElementById("typing-text");

            let index = 0;

            function typeText() {

                if (index < text.length) {
                    element.textContent += text[index];
                    index++;
                    setTimeout(typeText, 70);
                } else {
                    setTimeout(() => {
                        element.textContent = "";  // يختفي مرة وحدة
                        index = 0;
                        typeText(); // يعيد الكتابة
                    }, 1500);
                }
            }

            typeText();

        });
    </script>

</body>

</html>
