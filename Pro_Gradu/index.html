<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ادارة التدريب الميداني</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body dir="rtl">

    <!-- ================================================= -->
    <!--                     NAVBAR                        -->
    <!-- ================================================= -->

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="logoo2.png" alt="Logo" class="nav-logo-img">
                <span id="navTitle">نظام التدريب</span>
            </div>

            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="#" id="navHome">الرئيسية</a></li>
                    <li><a href="#" id="navAbout">عن النظام</a></li>
                    <li><a href="#" id="navProcess">آلية التدريب</a></li>
                    <li><a href="#" id="navContact">تواصل معنا</a></li>
                </ul>

                <button id="langToggle" class="lang-btn">
                    <i class="fa-solid fa-language"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- ================================================= -->
    <!--                  HERO SECTION                     -->
    <!-- ================================================= -->

    <section class="hero">
        <div class="left-panel"></div>

        <!-- القسم الأزرق المائل -->
        <div class="overlay-panel">

            <!-- المحتوى الداخلي -->
            <div class="content">

                <img src="logoo2.png" alt="Logo" class="logo">

                <h1 class="site-name" id="mainTitle">ادارة التدريب الميداني</h1>

                <p id="typing-text"></p>

                <div class="btn-group">
                    <button class="start-btn login-btn" id="loginBtn">تسجيل دخول</button>
                    <button class="start-btn register-btn" id="registerBtn">إنشاء حساب</button>
                </div>

            </div>

        </div>

    </section>
    
    <script src="js/main.js"></script>

</body>

</html>
